    </div>

    <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-2 w-100 w-md-auto">
        {{#admin}}
        <button class="btn" onclick="window.location.href = 'admin_panel'">Admin</button>
        <button class="btn" onclick="window.location.href = 'form_book'">Add book</button>
        <button class="btn" onclick="window.location.href = 'form_game'">Add game</button>
        {{/admin}}
        {{#sign_up}}
        <button class="btn" onclick="window.location.href = 'sign_up'">Create account</button>
        {{/sign_up}}
        {{#sign_in}}
        <button class="btn" onclick="window.location.href = 'sign_in'">Sign in</button>
        {{/sign_in}}
    </div>

    <div class="d-flex flex-grow-1 align-items-center justify-content-end">
        {{#search_bar}}
        <div class="search d-flex align-items-center" role="search">
            <input type="search" aria-label="Search" />
            <i class="bi bi-search"></i>
        </div>
        {{/search_bar}}
    </div>

    <div class="d-flex justify-content-center justify-content-md-end align-items-center gap-4 w-md-auto">
        {{#user}}
        <button id="themeToggle" class="btn rounded-circle d-flex align-items-center justify-content-center"><i
                class="bi bi-moon-stars-fill"></i></button>
        <div class="user-profile-img" onclick="window.location.href = 'user_profile'"></div>
        {{/user}}
    </div>
</header>
