<!doctype html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <h2 class="text-center">Sign in!</h2>
      <div class="popup-container d-flex align-items-center justify-content-center position-relative">
        <div class="popup d-flex align-items-center flex-column">
          <form action="user-sign-in" method="post">
            <div>
              <label class="form-label">Username</label>
              <input type='text' name='username' class="form-control mb-3" placeholder="Username"/>
            </div>

            <div>
              <label class="form-label">Password</label>
              <input type='password' name='password' class="form-control mb-3" placeholder="Password"/>
            </div>

            <div class="d-flex flex-row gap-2">
              <input type='submit' class="btn" value='Sign in'>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
