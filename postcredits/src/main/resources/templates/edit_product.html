<!doctype html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  {{>header}}

  <main class="d-flex align-items-center">
  <div class="container">
    {{#type}}
    
    <form action="/edit_product/update/{{id}}" method="post" enctype="multipart/form-data">
       <div class="field mb-3">
        <div class="form-label font-weight-bold">Title</div>
        <input type="text" name="name" class="form-control" value="{{name}}" />
      </div>
  
  <div class="field mb-3">
    <div class="form-label">Book Cover</div>
    <div class="custom-file-upload d-flex align-items-center">
      <button type="button" class="btn" onclick="document.getElementById('product_imagen').click()">
        Change cover
      </button>
      <span id="file-name" class="current-filename">{{imageURL}}</span>
      
      <input type="file" id="product_imagen" name="imagen" style="display: none" accept="image/*" />
    </div>
  </div>
  {{#book}}
      <div class="field mb-3">
        <div class="form-label font-weight-bold">Author</div>
        <input type="text" name="author" class="form-control" value="{{author}}" />
      </div>
  {{/book}}
  {{#game}}
      <div class="field mb-3">
        <div class="form-label font-weight-bold">Company</div>
        <input type="text" name="company" class="form-control" value="{{company}}" />
      </div>
  {{/game}}
      <div class="field mb-3">
        <div class="form-label font-weight-bold">Genre</div>
        <input type="text" name="genre" class="form-control" value="{{genre}}" />
      </div>
  {{#book}}
      <div class="field mb-3">
        <div class="form-label font-weight-bold">Saga</div>
        <input type="text" name="saga" class="form-control" value="{{saga}}" />
      </div>
  {{/book}}
  {{#game}}
      <div class="field mb-3">
        <div class="form-label font-weight-bold">Franchise</div>
        <input type="text" name="franchise" class="form-control" value="{{franchise}}" />
      </div>
  {{/game}}

      <div class="field mb-3">
        <div class="form-label">Date of Publication</div>
        <input type="date" name="date" id="publish_date" class="form-control" value="{{htmlDate}}" />
      </div>

      <div class="field mb-3">
        <div class="form-label font-weight-bold">Synopsis</div>
        <textarea name="synopsis" class="form-control" rows="4">{{synopsis}}</textarea>
      </div>

      <div class="buttons d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-primary px-4">
          Save Changes
        </button>
        <a href="/product_page/{{id}}" class="btn btn-secondary px-4">
          Cancel
        </a>
      </div>
    </form>
    {{/type}}
  </div>
</main>

  {{>footer}}
  <script src="../js/edit_product.js"></script>
  <script src="../js/theme_change.js"></script>
</body>

</html>
