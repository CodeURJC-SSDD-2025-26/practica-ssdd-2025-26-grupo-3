<!doctype html>
<html lang="en" data-bs-theme="dark" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <div class="products mb-5">
        <h2 class="text-center mb-3">Products</h2>
        <div class="row g-3">
          <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-center">
            <div class="card w-75 h-100" onclick="window.location.href = 'product_page.html'">
              <img src="../images/El_señor_de_la_humanidad.jpg" class="product-img" />
              <div class="card-title text-center pt-1">
                <h6>El señor de la humanidad</h6>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-center">
            <div class="card w-75 h-100" onclick="window.location.href = 'product_page.html'">
              <img src="../images/Nacidos_de_la_Bruma_El_imperio_final.png" class="product-img" />
              <div class="card-title text-center pt-1">
                <h6>Nacidos de la bruma</h6>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-center">
            <div class="card w-75 h-100" onclick="window.location.href = 'product_page.html'">
              <img src="../images/silksong.png" class="product-img" />
              <div class="card-title text-center pt-1">
                <h6>Silksong</h6>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-center">
            <div class="card w-75 h-100" onclick="window.location.href = 'product_page.html'">
              <img src="../images/Skyrim.png" class="product-img" />
              <div class="card-title text-center pt-1">
                <h6>Skyrim</h6>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2 class="text-center">Most liked</h2>
        <div class="ranking d-flex align-items-end justify-content-around border p-3">
          <div class="text-center">
            <div class="bar" style="height: 80px"></div>
            <small>Book</small>
          </div>
          <div class="text-center">
            <div class="bar" style="height: 150px"></div>
            <small>Game</small>
          </div>
          <div class="text-center">
            <div class="bar" style="height: 120px"></div>
            <small>Book</small>
          </div>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
