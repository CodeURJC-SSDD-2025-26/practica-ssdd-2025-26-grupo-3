<!DOCTYPE html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">

  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <div class="field">
        <div class="form-label">Title</div>
        <input type="text" id="title" class="form-control" placeholder="Enter game's title...">
      </div>
      <div class="field">
        <div class="form-label">Game Cover</div>
        <input type="file" id="product_imagen" name="imagen">
      </div>
      <div class="field">
        <div class="form-label">Company</div>
        <input type="text" id="company" class="form-control" placeholder="Enter the company...">
      </div>
      <div class="field">
        <div class="form-label">Genre</div>
        <input type="text" id="genre" class="form-control" placeholder="Enter game's genre...">
      </div>
      <div class="field">
        <div class="form-label">Franchise</div>
        <input type="text" id="franchise" class="form-control"
          placeholder="Enter the franchise the game belongs to (if it applies)...">
      </div>
      <div class="field">
        <div class="form-label">Date of Publication</div>
        <input type="date" id="date" class="form-control">
      </div>
      <div class="field">
        <div class="form-label">Synopsis</div>
        <input type="text" id="synopsis" class="form-control" placeholder="Enter the game's synopsis...">
      </div>
      <div class="buttons d-flex justify-content-center">
        <button type="button" class="btn" onclick="window.location.href='home.html'">Publish game</button>
      </div>
    </div>
  </main>
  
{{>footer}}

</body>

</html>
