<!doctype html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <div class="user-card">
        <div class="user-group d-flex flex-row align-items-center justify-content-between">
          <div class="user-item d-flex flex-row align-items-center">
            <div class="avatar me-3"></div>
            <span class="username text-center">Usuario 1</span>
          </div>

          <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-2 ms-3">
            <button class="btn">Profile</button>
            <button class="btn">Ban</button>
          </div>
        </div>

        <div class="user-group d-flex flex-row align-items-center justify-content-between">
          <div class="user-item d-flex flex-row align-items-center">
            <div class="avatar me-3"></div>
            <span class="username text-center">Usuario 2</span>
          </div>

          <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-2 ms-3">
            <button class="btn">Profile</button>
            <button class="btn">Ban</button>
          </div>
        </div>

        <div class="user-group d-flex flex-row align-items-center justify-content-between">
          <div class="user-item d-flex flex-row align-items-center">
            <div class="avatar d-inline-block me-3"></div>
            <span class="username text-center">Usuario 3</span>
          </div>

          <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-2 ms-3">
            <button class="btn">Profile</button>
            <button class="btn">Ban</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
