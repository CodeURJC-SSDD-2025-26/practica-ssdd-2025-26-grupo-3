<!doctype html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <div class="profile-card">
        <div class="row align-items-center">
          <div class="col-12 col-md-4">
            <div class="profile-image d-inline-block" id="user-img"></div>
            <input type="file" id="file-input" accept="image/*" style="display: none" />
          </div>

          <div class="col-12 col-md-8">
            <div>
              <label class="form-label">Name</label>
              <input type="text" id="name" class="form-control mb-3" value="Lorem ipsum" disabled />
            </div>
            <div>
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control mb-3" value="pass" disabled />
            </div>

            <div class="d-flex flex-row gap-2">
              <button class="btn flex-md-row" id="back-button">Back</button>
              <button class="btn flex-md-row" id="edit-button">Edit</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
