<!DOCTYPE html>
<html lang="en" class="d-flex flex-column h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostCredits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../styles/page.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="d-flex flex-column h-100">
  
  {{>header}}

  <main class="d-flex align-items-center">
    <div class="container">
      <form action="rate.php" method="post">
        <div class="field">
          <div class="rating">
            <input type="radio" id="star1" name="rated" value="1" />
            <label for="star1" title="1 star">★</label>
            <input type="radio" id="star2" name="rated" value="2" />
            <label for="star2" title="2 stars">★</label>
            <input type="radio" id="star3" name="rated" value="3" />
            <label for="star3" title="3 stars">★</label>
            <input type="radio" id="star4" name="rated" value="4" />
            <label for="star4" title="4 stars">★</label>
            <input type="radio" id="star5" name="rated" value="5" />
            <label for="star5" title="5 stars">★</label>
          </div>
        </div>
      </form>
      <div class="field">
        <div class="form-label">Review</div>
        <input type="text" id="saga" class="form-control" placeholder="Write your review...">
      </div>
      <div class="buttons d-flex justify-content-center">
        <button type="button" class="btn" onclick="window.location.href='home.html'">Publish review</button>
      </div>
    </div>
  </main>

  {{>footer}}
  
</body>

</html>
