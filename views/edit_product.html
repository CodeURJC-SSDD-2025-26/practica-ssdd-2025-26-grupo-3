<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PostCredits</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="../styles/home.css">
        <link rel="stylesheet" href="../styles/user_profile.css">
        <link rel="stylesheet" href="../styles/edit_product.css">
    </head>
    <body>
        <header class="topbar">
            <div class="left">
                <div class="brand-icon" title="menu"></div>
            </div>
            <div class="center">
            <button type="button" class="pill-btn" onclick="window.location.href='home.html'">Home</button>
            </div>
            <div class="right">
                <div class="circle"></div>
                <div class="circle" style="width:30px;height:30px;margin-left:12px"></div>
            </div>
        </header>
        <div class="container">
            <div class="form-label">Title</div>
            <input type="text" id="genre" class="form-control" placeholder="El Señor de la Humanidad">

            <div class="form-label">Book Cover</div>
            <div class="custom-file-upload">
                <button type="button" class="pill-btn secondary" onclick="document.getElementById('product_imagen').click()">
                    Cambiar Portada
                </button>
    
                <span id="file-name" class="current-filename">El_señor_de_la_humanidad.jpg</span>

                <input type="file" id="product_imagen" name="imagen" style="display: none;">
            </div>

            <div class="form-label">Author</div>
            <input type="text" id="genre" class="form-control" placeholder="Aaron Dembski-Bowden">
        
            <div class="form-label">Genre</div>
            <input type="text" id="genre" class="form-control" placeholder="Belic Science Fiction">

            <div class="form-label">Saga</div>
            <input type="text" id="saga" class="form-control" placeholder="The Horus Heresy">

            <div class="form-label">Editorial</div>
            <input type="text" id="genre" class="form-control" placeholder="Black Library (Games Workshop)">

            <div class="form-label">Date of Publication</div>
            <input type="date" id="publish_date" class="form-control" value="2016-12-01">

            <div class="form-label">Synopsis</div>
            <input type="text" id="genre" class="form-control" placeholder="While the flames of Horus’s rebellion consume the galaxy, a secret war rages within the Impossible City, deep beneath the Imperial Palace. The Emperor of Mankind is locked in a desperate struggle to stabilize a breach in the Eldar Webway—the key to humanity’s future. As the Custodian Guard and the Sisters of Silence battle endless tides of daemons, 
            the story offers a rare and haunting glimpse into the mind of the Emperor Himself, revealing the cold reality of His vision and the devastating price of His Great Work.">

            <button type="button" class="pill-btn" onclick="window.location.href='product_page.html'">Edit book</button>
        </div>
        <footer>
            <p>©2026 PostCredits. Todos los derechos reservados.</p>
            <p>Contacto: soporte@postcredits.com | +1 234 567 89</p>
        </footer>
        <script>
            // El código que busca los elementos por su ID
            const fileInput = document.getElementById('product_imagen');
            const fileNameLabel = document.getElementById('file-name');
            const statusBadge = document.querySelector('.status-badge');

            // La función que se activa cuando cambias el archivo
            fileInput.onchange = function() {
                if (this.files.length > 0) {
                    // Actualiza el texto con el nombre del archivo seleccionado
                    fileNameLabel.textContent = this.files[0].name;
                    
                    // Cambia el estilo de la etiqueta para indicar que es nuevo
                    statusBadge.textContent = "Nuevo";
                    statusBadge.style.background = "#007bff"; // Azul de Bootstrap
                }
            };
        </script>
    </body>
</html>
