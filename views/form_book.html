<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostCredits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../styles/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="topbar">
        <div class="brand-icon"></div>
        <button type="button" class="pill-btn" onclick="window.location.href='home.html'">Home</button>
        <div class="user-profile-img"></div>
    </header>
    <main>
        <div class="container">
            <div class="field">
                <div class="form-label">Title</div>
                <input type="text" id="genre" class="form-control" placeholder="Enter book's title...">
            </div>
            <div class="field">
                <div class="form-label">Book Cover</div>
                <input type="file" id="product_imagen" name="imagen">
            </div>
            <div class="field">
                <div class="form-label">Author</div>
                <input type="text" id="genre" class="form-control" placeholder="Enter Author's name...">
            </div>
            <div class="field">
                <div class="form-label">Genre</div>
                <input type="text" id="genre" class="form-control" placeholder="Enter book's genre...">
            </div>
            <div class="field">
                <div class="form-label">Saga</div>
                <input type="text" id="saga" class="form-control"
                    placeholder="Enter the saga the book belongs to (if so)...">
            </div>
            <div class="field">
                <div class="form-label">Editorial</div>
                <input type="text" id="genre" class="form-control" placeholder="Enter the editorial...">
            </div>
            <div class="field">
                <div class="form-label">Date of Publication</div>
                <input type="date" class="form-control">
            </div>
            <div class="field">
                <div class="form-label">Synopsis</div>
                <input type="text" id="genre" class="form-control" placeholder="Enter the book's synopsis...">
            </div>
            <div class="buttons">
                <button type="button" class="pill-btn" onclick="window.location.href='home.html'">Publish book</button>
            </div>
        </div>
    </main>

    <footer>
        <p>©2026 PostCredits. All rights reserved.</p>
        <p>Contact: soporte@postcredits.com | +1 234 567 89</p>
    </footer>
</body>

</html>
